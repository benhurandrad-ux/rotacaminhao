<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Rota Caminhão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --card:#FFFFFF;--card-border:rgba(11,18,32,.06);--text:#0B1220;--muted:#5B6779;--divider:#E9ECF1;
  --inner:#F1F3F7;--pressed:#E4E8EF;--accent:#1F6BFF;--accent-soft:#E8F0FF;--on-accent:#FFFFFF;
  --go:#16A34A;--go-press:#15803D;--on-go:#FFFFFF;--warn:#F59E0B;--on-warn:#1F1300;--warn-soft:#FFF3DC;--on-warn-soft:#7A4B00;
  --danger:#E5484D;--on-danger:#FFFFFF;--danger-soft:#FDE8E9;--on-danger-soft:#9F1239;
  --shadow:0 8px 24px rgba(11,18,32,.14),0 1px 2px rgba(11,18,32,.06);--scrim:rgba(11,18,32,.24);--handle:#D5DAE2;--halo:rgba(31,107,255,.18);
  --blur:none;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html[data-theme="night"]{
  --card:rgba(19,26,40,.82);--card-border:rgba(255,255,255,.08);--text:#F2F5FB;--muted:#A9B4C6;--divider:rgba(255,255,255,.08);
  --inner:rgba(255,255,255,.08);--pressed:rgba(255,255,255,.14);--accent:#4D8BFF;--accent-soft:rgba(77,139,255,.18);--on-accent:#FFFFFF;
  --go:#22C55E;--go-press:#16A34A;--on-go:#052E16;--warn:#F59E0B;--on-warn:#1F1300;--warn-soft:rgba(245,158,11,.18);--on-warn-soft:#FCD34D;
  --danger:#F0565B;--on-danger:#FFFFFF;--danger-soft:rgba(240,86,91,.18);--on-danger-soft:#FCA5A5;
  --shadow:0 8px 24px rgba(0,0,0,.45);--scrim:rgba(0,0,0,.4);--handle:rgba(255,255,255,.25);--halo:rgba(77,139,255,.22);--blur:blur(20px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;width:100%}
body{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;color:var(--text);font-size:17px;line-height:1.3;font-variant-numeric:tabular-nums;background:#0B1220;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(.94)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg{display:block}
#map{position:absolute;inset:0;z-index:0;background:#E8ECF2}
html[data-theme="night"] #map{background:#0B1220}
html[data-theme="night"] .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.82) contrast(.92) saturate(.6)}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:11px!important;opacity:.7;background:transparent!important;color:var(--muted)!important;margin:0 12px 122px 0!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.pos{width:64px;height:64px;position:relative}
.pos .halo{position:absolute;inset:8px;border-radius:50%;background:var(--halo)}
.pos svg{position:absolute;inset:0;width:64px;height:64px;transform:rotate(var(--hd,0deg));transition:transform .3s ease-out;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.ab{background:#fff;color:#0B1220;font-weight:700;font-size:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.radar-dot{width:14px;height:14px;border-radius:50%;background:#E5484D;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.rep-pin{width:28px;height:28px;border-radius:50%;background:var(--warn);color:var(--on-warn);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.rep-pin svg{width:16px;height:16px}

/* camadas: wrappers não recebem toque, só os controles */
.layer{position:absolute;inset:0;z-index:10;pointer-events:none;display:none}
.layer.on{display:block}
.layer>*{pointer-events:auto}
.card{background:var(--card);border:1px solid var(--card-border);border-radius:24px;box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.pill{border-radius:999px}
.round{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.round.md{width:56px;height:56px}
.round.sm{width:48px;height:48px}
.round.xs{width:40px;height:40px}
.round svg{width:24px;height:24px}
.inner{background:var(--inner)}
.inner:active{background:var(--pressed);filter:none}
.chip{position:absolute;top:calc(var(--sat) + 12px);left:16px;height:48px;padding:0 16px 0 14px;display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600}
.chip svg{width:22px;height:22px;color:var(--muted)}
.search-pill{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 16px);height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;font-size:20px;font-weight:500;color:var(--muted);text-align:left;border-radius:999px}
.search-pill svg{width:24px;height:24px;color:var(--accent)}
.center-btn{position:absolute;right:16px;bottom:calc(var(--sab) + 92px);display:none}
.center-btn.on{display:grid}
.back-btn{position:absolute;top:calc(var(--sat) + 12px);left:16px}
.notice{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 72px);min-height:56px;display:none;align-items:center;gap:10px;padding:0 8px 0 16px;font-size:15px;font-weight:600;background:var(--warn-soft);color:var(--on-warn-soft);border-radius:20px;box-shadow:var(--shadow)}
.notice.on{display:flex}
.notice span{flex:1}
.notice button{width:44px;height:44px;display:grid;place-items:center}
.notice svg{width:20px;height:20px}

/* folhas */
.scrim{position:absolute;inset:0;z-index:20;background:var(--scrim);display:none}
.scrim.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--card-border);border-radius:24px 24px 0 0;box-shadow:var(--shadow);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transform:translateY(110%);visibility:hidden;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s .22s;display:flex;flex-direction:column;height:var(--h,300px);will-change:transform}
.sheet.on{transform:translateY(calc(var(--h) - var(--vis)));visibility:visible;transition:transform .22s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet.dragging{transition:none}
.handle{height:24px;flex:none;display:grid;place-items:center;touch-action:none;cursor:grab}
.handle::before{content:'';width:40px;height:5px;border-radius:3px;background:var(--handle)}
.sheet .head{flex:none;padding:0 16px;touch-action:none}
.sheet .body{flex:1;min-height:0;overflow:auto;padding:0 16px calc(var(--sab) + 16px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet h2{font-size:22px;font-weight:700;margin:0}
.titlebar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px;touch-action:none}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.on{transition:none}}

/* botões */
.btn{height:64px;width:100%;border-radius:20px;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:24px;height:24px}
.btn.go{background:var(--go);color:var(--on-go)}.btn.go:active{background:var(--go-press);filter:none}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.sec{height:56px;border-radius:18px;font-size:15px;font-weight:600;background:var(--inner)}
.btn.sec:active{background:var(--pressed);filter:none}
.btn.sec svg{width:20px;height:20px;color:var(--accent)}
.btn.outline{height:56px;border-radius:18px;font-size:16px;font-weight:600;border:1.5px solid var(--divider);background:transparent}
.btn.outline svg{width:20px;height:20px;color:var(--accent)}
.btn.danger{height:56px;border-radius:18px;font-size:16px;font-weight:600;background:var(--danger-soft);color:var(--on-danger-soft)}
.btn[disabled]{opacity:.45}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}

/* busca */
.searchbar{display:flex;gap:12px;align-items:center;padding:0 16px 12px}
.field{flex:1;height:56px;border-radius:18px;background:var(--inner);display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;min-width:0}
.field svg{width:22px;height:22px;color:var(--muted);flex:none}
.field input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;font-weight:500;color:var(--text);outline:none;height:100%}
.field input::placeholder{color:var(--muted)}
.field .clear{width:44px;height:44px;display:none;place-items:center;border-radius:50%}
.field .clear.on{display:grid}
.sec-h{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 0}
.li{width:100%;min-height:64px;display:flex;align-items:center;gap:16px;text-align:left;border-radius:0}
.li .ic{width:40px;height:40px;border-radius:50%;background:var(--inner);display:grid;place-items:center;flex:none}
.li .ic svg{width:20px;height:20px;color:var(--muted)}
.li .tx{flex:1;min-width:0;padding:10px 0;border-bottom:1px solid var(--divider)}
.li b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li span{display:block;font-size:14px;font-weight:500;color:var(--muted)}
.li:last-child .tx{border-bottom:0}
.empty{padding:24px 0;text-align:center;color:var(--muted);font-size:16px;font-weight:500}
.link-row{height:56px;width:100%;color:var(--accent);font-size:16px;font-weight:600;text-align:left}

/* prévia */
.pv-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.pv-head b{font-size:40px;font-weight:700;line-height:1;white-space:nowrap}
.pv-head span{font-size:17px;font-weight:500;color:var(--muted);text-align:right}
.seal{height:40px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;margin-top:12px}
.seal span{overflow:hidden;text-overflow:ellipsis}
.seal svg{width:18px;height:18px;flex:none}
.seal .eyeb,.state .eyeb{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.08);flex:none;padding:0}
.seal .eyeb svg,.state .eyeb svg{width:18px;height:18px}
.seal.neutral{background:var(--inner);color:var(--text)}
.seal.acc{background:var(--accent-soft);color:var(--accent)}
.seal.warn{background:var(--warn-soft);color:var(--on-warn-soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .seal{margin:0;flex:none;height:40px}
.calc{font-size:17px;font-weight:500}
.bar{height:4px;background:var(--inner);border-radius:2px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.2s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.cmp{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0 8px;font-size:16px}
.cmp>div{min-height:52px;display:flex;align-items:center;border-bottom:1px solid var(--divider)}
.cmp .h{font-weight:600;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.cmp .car{color:var(--muted)}.cmp .tr{color:var(--accent);font-weight:700}
.cmp .bad{color:var(--danger);font-weight:700}.cmp .wr{color:var(--on-warn-soft);font-weight:700}
.cmp .v{display:flex;align-items:center;gap:6px;width:100%}
.cmp .eyeb{width:32px;height:32px;border-radius:50%;background:var(--inner);display:grid;place-items:center;flex:none;padding:0;margin-left:auto}
.cmp .eyeb svg{width:16px;height:16px;color:var(--accent)}
.steps div{display:flex;gap:12px;align-items:center;min-height:60px;border-bottom:1px solid var(--divider);font-size:16px}
.steps div span:first-child{width:64px;flex:none;color:var(--muted);font-weight:600;font-size:14px}
.steps svg.man{width:28px;height:28px;flex:none;color:var(--accent)}
.steps .eye{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
.steps .eye svg{width:20px;height:20px;color:var(--accent)}
.svbox{position:relative;width:100%;height:min(58vh,520px);background:var(--inner);border-radius:20px;overflow:hidden}
.svbox iframe{width:100%;height:100%;border:0}

/* navegação */
.nav-card{position:absolute;top:calc(var(--sat) + 8px);left:12px;right:12px;min-height:96px;max-height:112px;display:flex;align-items:center;gap:14px;padding:14px 16px}
.man-ic{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.man-ic svg{width:44px;height:44px}
.man-tx{min-width:0;flex:1}
.man-tx .d{font-size:30px;font-weight:700;line-height:1.05}
.man-tx .i{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.man-tx .i small{font-size:14px;font-weight:500;color:var(--muted)}
.state{position:absolute;top:calc(var(--sat) + 112px);left:12px;right:12px;height:44px;display:none;align-items:center;gap:8px;padding:0 6px 0 14px;font-size:15px;font-weight:600;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap;overflow:hidden}
.state.on{display:flex}
.state span{flex:1;overflow:hidden;text-overflow:ellipsis}
.state svg{width:20px;height:20px;flex:none}
.state.card-s{background:var(--card);color:var(--text);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.state.acc{background:var(--accent);color:#fff}
.state.danger{background:var(--danger);color:#fff}
.state.warn{background:var(--warn);color:var(--on-warn)}
.state.ok{background:var(--go);color:var(--on-go)}
.state button{height:36px;padding:0 14px;border-radius:999px;background:rgba(0,0,0,.18);font-size:14px;font-weight:700;color:inherit}
.nav-bot{position:absolute;left:12px;right:12px;bottom:calc(var(--sab) + 12px);height:88px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px}
.eta{text-align:left;flex:1;height:100%;display:flex;flex-direction:column;justify-content:center;min-width:0}
.eta b{font-size:26px;font-weight:700;line-height:1}
.eta span{font-size:14px;font-weight:500;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbtns{display:flex;gap:12px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;width:60px}
.rb .round{margin:0 auto}
.rb .round svg{color:var(--accent)}
.rb.warn .round svg{color:var(--warn)}
.rb small{font-size:11px;font-weight:600;color:var(--muted)}
.speed{position:absolute;right:16px;bottom:calc(var(--sab) + 112px);width:56px;height:56px;border-radius:50%;background:#fff;border:4px solid #E5484D;color:#0B1220;display:none;place-items:center;font-size:22px;font-weight:700;box-shadow:var(--shadow)}
.speed.on{display:grid}
.speed.over{background:#E5484D;color:#fff}
.nav-center{position:absolute;right:16px;bottom:calc(var(--sab) + 180px);display:none}
.nav-center.on{display:grid}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{height:96px;border-radius:20px;background:var(--inner);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:600}
.tile:active{background:var(--pressed);filter:none}
.tile svg{width:28px;height:28px;color:var(--accent)}
.tile.cancel{background:transparent;border:1.5px solid var(--divider)}
.tile.cancel svg{color:var(--muted)}

/* primeiro uso */
.ob{position:absolute;inset:0;z-index:25;background:var(--scrim);display:none;flex-direction:column;padding:calc(var(--sat) + 16px) 16px calc(var(--sab) + 16px);gap:12px;overflow:auto}
.ob.on{display:flex}
.ob h1{font-size:28px;font-weight:700;margin:0;padding:20px 20px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{min-height:112px;border-radius:20px;text-align:left;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tcard svg{width:34px;height:26px;color:var(--muted);flex:none}
.tcard b{font-size:22px;font-weight:700;display:block}
.tcard small{font-size:14px;font-weight:500;color:var(--muted)}
.ob .link{color:#fff;font-size:16px;font-weight:600;text-decoration:underline;min-height:56px;text-align:center}

/* configurações */
.group{background:var(--inner);border-radius:20px;overflow:hidden;margin-bottom:12px}
.srow{width:100%;min-height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;font-size:17px;font-weight:500;text-align:left;border-bottom:1px solid var(--divider)}
.group .srow:last-child{border-bottom:0}
.srow small{color:var(--muted);font-size:14px;font-weight:500;display:flex;align-items:center;gap:6px}
.srow small svg{width:20px;height:20px}
.sw{width:51px;height:31px;border-radius:999px;background:var(--handle);position:relative;flex:none}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:22px}
.seg{display:flex;background:var(--pressed);border-radius:999px;padding:3px;gap:2px}
.seg button{height:38px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.meas{padding:12px 16px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.meas label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.meas .f{position:relative}
.meas input{width:100%;height:56px;border-radius:16px;border:0;background:var(--card);color:var(--text);font:inherit;font-size:20px;font-weight:600;padding:0 44px 0 14px;box-shadow:inset 0 0 0 1px var(--divider)}
.meas .f span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;font-weight:600}
.meas .full{grid-column:1/-1}
.arr-ic{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:12px}
.arr-ic svg{width:28px;height:28px}
.tag{font-size:14px;font-weight:500;color:var(--muted)}
</style>
</head>
<body>
<div id="map" aria-hidden="true"></div>

<!-- Primeiro uso -->
<div class="ob" id="ob">
  <div class="card" style="padding:4px"><h1>Qual é o seu caminhão?</h1></div>
  <div class="tgrid" id="truckGrid"></div>
  <button class="link" id="obAdjust">Ajustar altura, peso e comprimento</button>
</div>

<!-- Home -->
<div class="layer" id="l-home">
  <button class="card pill chip" id="chip" aria-label="Meu caminhão e configurações"></button>
  <div class="notice" id="notice"><span id="noticeTx"></span><button id="noticeX" aria-label="Fechar"></button></div>
  <button class="card round center-btn" id="centerBtn" aria-label="Centralizar"></button>
  <button class="card search-pill" id="whereBtn"><span id="icSearch"></span><span>Pra onde?</span></button>
</div>

<!-- Prévia -->
<div class="layer" id="l-preview">
  <button class="card round sm back-btn" id="pvBack" aria-label="Voltar"></button>
  <div class="notice" id="pickNotice"><span id="pickTx"></span><button id="pickCancel" aria-label="Cancelar"></button></div>
</div>

<!-- Navegação -->
<div class="layer" id="l-nav">
  <div class="card nav-card" id="navCard"></div>
  <div class="state" id="stateBar"></div>
  <div class="speed" id="speed" aria-label="Limite de velocidade"></div>
  <button class="card round nav-center" id="navCenter" aria-label="Centralizar"></button>
  <div class="card nav-bot">
    <button class="eta" id="etaBtn" aria-label="Opções da viagem"><b id="etaTime">--:--</b><span id="etaSub"></span></button>
    <div class="rbtns">

const SHEETS={};let scrimOwner=null;

  constructor(id,snaps,opts={}){this.el=$(id);this.snaps=snaps;this.opts=opts;this.state=null;SHEETS[id]=this;
    this.el.querySelectorAll('.handle,.head,.titlebar').forEach(g=>g.addEventListener('pointerdown',e=>this.down(e)));
    this.el.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>this.close());}
  vis(state){const v=this.snaps[state];return typeof v==='function'?v():v;}
  open(state){state=state||Object.keys(this.snaps)[0];const h=Math.max(...Object.keys(this.snaps).map(k=>this.vis(k)));
    this.el.style.setProperty('--h',h+'px');this.el.style.setProperty('--vis',this.vis(state)+'px');this.state=state;
    Object.values(SHEETS).forEach(s=>{if(s!==this&&s.state)s.close(true);});
    this.el.classList.add('on');if(this.opts.scrim!==false)$('scrim').classList.add('on');else $('scrim').classList.remove('on');scrimOwner=this;}
  close(silent){this.el.classList.remove('on','dragging');const was=this.state;this.state=null;if(scrimOwner===this){$('scrim').classList.remove('on');scrimOwner=null;}
    if(!silent&&was&&this.opts.onClose)this.opts.onClose();}
  down(e){if(e.target.closest('button,input'))return;this.el.setPointerCapture(e.pointerId);this.y0=e.clientY;this.v0=this.vis(this.state);this.cur=this.v0;this.el.classList.add('dragging');
    const H=parseFloat(this.el.style.getPropertyValue('--h'));
    const mv=ev=>{const v=Math.max(0,Math.min(H,this.v0-(ev.clientY-this.y0)));this.el.style.setProperty('--vis',v+'px');this.cur=v;};
    const up=()=>{this.el.removeEventListener('pointermove',mv);this.el.removeEventListener('pointerup',up);this.el.removeEventListener('pointercancel',up);this.el.classList.remove('dragging');
      const v=this.cur;const keys=Object.keys(this.snaps);let best=keys[0],bd=1e9;keys.forEach(k=>{const d=Math.abs(this.vis(k)-v);if(d<bd){bd=d;best=k;}});

    this.el.addEventListener('pointermove',mv);this.el.addEventListener('pointerup',up);this.el.addEventListener('pointercancel',up);}
}

async function post(ep,body){const r=await fetch(`${VALHALLA}/${ep}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(ep+' '+r.status);return r.json();}
function decode(str,prec=6){let i=0,lat=0,lng=0,out=[],f=Math.pow(10,prec);while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lng+=(r&1)?~(r>>1):(r>>1);out.push([lat/f,lng/f]);}return out;}
function truckOpts(){const t=S.truck;return {truck:{height:t.h,width:t.w,length:t.l,weight:t.wt,axle_load:Math.min(10,t.wt/t.ax),axle_count:t.ax,use_highways:1,use_tolls:S.toll?1:0,use_tracks:0,exclude_unpaved:true,use_living_streets:0,service_penalty:600}}}
async function route(a,b,costing,extraEx=[]){
  const body={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing,units:'kilometers',language:'pt-BR'};
  if(costing==='truck'){body.costing_options=truckOpts();const ex=S.reports.filter(r=>['dirt','bridge','notruck','narrow'].includes(r.type)).map(r=>({lat:r.lat,lon:r.lng})).concat(extraEx);if(ex.length)body.exclude_locations=ex.slice(-50);}

async function xray(shape,costing){
  const j=await post('trace_attributes',{encoded_polyline:shape,costing,shape_match:'edge_walk',units:'kilometers',filters:{attributes:['edge.surface','edge.road_class','edge.length','edge.begin_shape_index','edge.end_shape_index','edge.speed_limit','edge.names'],action:'include'}});
  const pts=decode(j.shape||shape),UNP=new Set(['compacted','dirt','gravel','path','impassable']),URB=new Set(['residential','unclassified','service_other','living_street']);
  let dirt=0,dirtAccess=0,urban=0,hwy=0,total=0,rough=0,dirtSegs=[],urbSegs=[],roughSegs=[],roughRanges=[],dirtRanges=[],limits=[],along=0;const routeKm=(j.edges||[]).reduce((a,e)=>a+(e.length||0),0);

    const access=along<0.5||routeKm-along<0.5;along+=L;const seg=pts.slice(e.begin_shape_index,e.end_shape_index+1);
    if(UNP.has(e.surface)){if(access)dirtAccess+=L;else{dirt+=L;dirtSegs.push(seg);const b=(along-L)*1000,en=along*1000,nm=(e.names||[])[0]||'';const last=dirtRanges[dirtRanges.length-1];if(last&&b-last.e<200){last.e=en;last.pts=last.pts.concat(seg.slice(1));if(!last.name&&nm)last.name=nm;}else dirtRanges.push({b,e:en,name:nm,pts:seg.slice()});}}else if(e.surface==='paved_rough'){rough+=L;roughSegs.push(seg);const b=(along-L)*1000,en=along*1000;const last=roughRanges[roughRanges.length-1];if(last&&b-last.e<200)last.e=en;else roughRanges.push({b,e:en});}else if(!access&&URB.has(e.road_class)){urban+=L;urbSegs.push(seg);}
    if(['motorway','trunk','primary'].includes(e.road_class))hwy+=L;}

let radarDB=null;fetch('radares.json').then(r=>r.ok?r.json():null).then(j=>{radarDB=j;}).catch(()=>{});
function radarsFromDB(rt){if(!radarDB)return [];const pts=rt.pts;let a=90,b=-90,c=180,d=-180;for(const p of pts){if(p[0]<a)a=p[0];if(p[0]>b)b=p[0];if(p[1]<c)c=p[1];if(p[1]>d)d=p[1];}
  const m=0.01,out=[];for(const r of radarDB){if(r[0]<a-m||r[0]>b+m||r[1]<c-m||r[1]>d+m)continue;const n=nearest(pts,[r[0],r[1]]);if(n.d>60)continue;out.push({lat:r[0],lon:r[1],max:r[2],along:rt.cum[n.i]+(rt.cum[n.i+1]-rt.cum[n.i])*n.t,id:r[0]+','+r[1]});}return out.sort((x,y)=>x.along-y.along);}
async function overpass(q,ms=12000){for(const srv of ['https://overpass-api.de/api/interpreter','https://lz4.overpass-api.de/api/interpreter']){const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(srv,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});clearTimeout(to);if(!r.ok)throw 0;return await r.json();}catch(e){clearTimeout(to);}}return null;}
function lineOf(rt){const pts=rt.pts;const step=Math.max(1,Math.floor(pts.length/160));return pts.filter((_,i)=>i%step===0||i===pts.length-1).map(p=>`${p[0].toFixed(5)},${p[1].toFixed(5)}`).join(',');}

  const all=[...local];((j&&j.elements)||[]).forEach(e=>{if(all.some(y=>Math.abs(y.lat-e.lat)<0.0003&&Math.abs(y.lon-e.lon)<0.0003))return;const n=nearest(rt.pts,[e.lat,e.lon]);all.push({lat:e.lat,lon:e.lon,max:parseInt((e.tags||{}).maxspeed)||null,along:rt.cum[n.i]+(rt.cum[n.i+1]-rt.cum[n.i])*n.t,id:e.lat.toFixed(5)+','+e.lon.toFixed(5)});});
  return all.sort((a,b)=>a.along-b.along);}
async function fetchUnknownSurface(rt){const j=await overpass(`[out:json][timeout:12];way[highway~"^(unclassified|tertiary|tertiary_link|track|road|secondary)$"][!surface](around:25,${lineOf(rt)});out geom;`);if(!j)return null;
  let km=0,segs=[];for(const w of (j.elements||[])){const g=(w.geometry||[]).map(n=>[n.lat,n.lon]);let cur=[];for(const pt of g){const n=nearest(rt.pts,pt);if(n.d<30)cur.push(pt);else{if(cur.length>1)segs.push(cur);cur=[];}}if(cur.length>1)segs.push(cur);}

const R=6371000,rad=x=>x*Math.PI/180;
function hav(a,b){const dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]);const s=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s));}

function nearest(pts,p){let best={i:0,t:0,d:1e12,pt:pts[0]};const kx=Math.cos(rad(p[0]));
  for(let i=0;i<pts.length-1;i++){const ax=(pts[i][1]-p[1])*kx,ay=pts[i][0]-p[0],bx=(pts[i+1][1]-p[1])*kx,by=pts[i+1][0]-p[0];const dx=bx-ax,dy=by-ay;const L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));

function headingAt(lat,lon){if(!S.route)return 0;const n=nearest(S.route.pts,[lat,lon]);const a=S.route.pts[n.i],b=S.route.pts[Math.min(n.i+1,S.route.pts.length-1)];const y=Math.sin(rad(b[1]-a[1]))*Math.cos(rad(b[0]));const x=Math.cos(rad(a[0]))*Math.sin(rad(b[0]))-Math.sin(rad(a[0]))*Math.cos(rad(b[0]))*Math.cos(rad(b[1]-a[1]));return (Math.atan2(y,x)*180/Math.PI+360)%360;}

/* desvio automático: se a rota de caminhão ainda pisa em chão fora da saída/chegada, exclui esses trechos e recalcula */
async function avoidDirt(tr,seq){
  let cur=tr,raw=null,x=await xray(cur.shape,'truck');S.noAlt=null;
  for(let round=0;round<2;round++){
    if(seq!==pvSeq)return null;
    if(x.dirt<=0.2||!x.dirtRanges.length)break;
    if(!raw)raw={route:cur,xray:x};
    const pts=[];
    for(const ch of x.dirtRanges){let acc=0;for(let i=1;i<ch.pts.length;i++){acc+=hav(ch.pts[i-1],ch.pts[i]);if(acc>400){pts.push({lat:ch.pts[i][0],lon:ch.pts[i][1]});acc=0;}}const m=ch.pts[Math.floor(ch.pts.length/2)];pts.push({lat:m[0],lon:m[1]});}
    let next;try{next=await route(S.origin,S.dest,'truck',pts.slice(0,50));}catch(e){S.noAlt={km:x.dirt,name:x.dirtRanges[0].name};break;}
    const nx=await xray(next.shape,'truck');
    if(nx.dirt>=x.dirt-0.2){S.noAlt={km:x.dirt,name:x.dirtRanges[0].name};break;}
    cur=next;x=nx;
  }
  if(cur===tr)raw=null;
  return {route:cur,xray:x,raw};
}

      setState(inside?`Asfalto ruim por mais ${len}`:`Asfalto ruim em ${fmtM(rr.b-along)}, por ${len}`,'warn',0,'rough',`<button class="eyeb" id="seeRoughNav" aria-label="Ver o asfalto ruim">${I.eye}</button>`,I.warn);const bq=$('seeRoughNav');if(bq)bq.onclick=()=>seeDirt('rough');

$('leaveNo').onclick=()=>shLeave.close();
$('leaveYes').onclick=()=>{shLeave.close(true);stopNav();showHome();};
$('voiceBtn').onclick=()=>{S.voice=!S.voice;store.set('voice',S.voice);$('voiceBtn').textContent=S.voice?'Som ligado':'Som desligado';};
$('simBtn').onclick=()=>{shTrip.close(true);if(simTimer){clearInterval(simTimer);simTimer=null;S.navi.sim=false;return;}startSim();};
function startSim(){
  S.navi.sim=true;S.navi.speed=80;const n0=nearest(S.route.pts,[S.pos.lat,S.pos.lon]);let along=S.route.cum[n0.i]+(S.route.cum[n0.i+1]-S.route.cum[n0.i])*n0.t;
  simTimer=setInterval(()=>{if(!S.navi)return;const rt=S.route;along+=(S.navi.speed/3.6)*6;let i=rt.cum.findIndex(c=>c>along);
    if(i<0)S.pos={lat:rt.pts.at(-1)[0],lon:rt.pts.at(-1)[1],speed:0};else{const t=(along-rt.cum[i-1])/(rt.cum[i]-rt.cum[i-1]);S.pos={lat:rt.pts[i-1][0]+t*(rt.pts[i][0]-rt.pts[i-1][0]),lon:rt.pts[i-1][1]+t*(rt.pts[i][1]-rt.pts[i-1][1]),speed:80};}
    posMarker.setLatLng([S.pos.lat,S.pos.lon]);navTick();},1000);
}
$('svNavBtn').onclick=()=>{if(!S.route||!S.pos)return;const r=S.route,n=nearest(r.pts,[S.pos.lat,S.pos.lon]);const along=r.cum[n.i]+(r.cum[n.i+1]-r.cum[n.i])*n.t;
  const m=r.maneuvers.find(x=>r.cum[x.begin_shape_index]>along+30&&![4,5,6].includes(x.type));const pt=m?r.pts[Math.max(0,m.begin_shape_index-1)]:[S.pos.lat,S.pos.lon];$('svTitle').textContent=m?'Próxima manobra':'Ver rua';openStreet(pt[0],pt[1]);};
/* relato */
$('repGrid').innerHTML=REPORT_TYPES.map(t=>`<button class="tile" data-id="${t.id}">${I[t.ic]}<span>${t.label}</span></button>`).join('')+`<button class="tile cancel" id="repCancel">${I.x}<span>Cancelar</span></button>`;
$('repBtn').onclick=()=>{shReport.open();clearTimeout(repAuto);repAuto=setTimeout(()=>shReport.close(),10000);};
$('repCancel').onclick=()=>shReport.close();
$('repGrid').querySelectorAll('.tile[data-id]').forEach(b=>b.onclick=()=>{clearTimeout(repAuto);
  const rep={type:b.dataset.id,lat:S.pos.lat,lng:S.pos.lon,date:new Date().toISOString(),sent:navigator.onLine};S.reports.push(rep);store.set('reports',S.reports);drawReports();shReport.close();
  setState(navigator.onLine?'Relato enviado. Obrigado.':'Relato guardado. Envio quando tiver sinal.','ok',4000,'sent','<button id="undoRep">Desfazer</button>',I.check);
  const u=$('undoRep');if(u)u.onclick=()=>{S.reports=S.reports.filter(x=>x!==rep);store.set('reports',S.reports);drawReports();clearState();};});

/* ===== configurações ===== */
function openSettings(){S.screen='settings';layer('l-home');renderSettings();shSettings.open();}
function renderSettings(){renderChip();const t=S.truck||TRUCKS[3];$('m_h').value=t.h;$('m_w').value=t.w;$('m_l').value=t.l;$('m_wt').value=t.wt;$('m_ax').value=t.ax;
  $('swToll').classList.toggle('on',S.toll);$('swVoice').classList.toggle('on',S.voice);$('segTheme').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));
  pickVoice();$('voiceName').innerHTML=`${I.sound}${ptVoice?esc(ptVoice.name):(window.speechSynthesis?'Padrão do celular':'Sem voz')}`;}
$('setTruck').onclick=()=>{shSettings.close(true);renderTruckGrid();$('ob').classList.add('on');};
$('saveMeas').onclick=()=>{S.truck={...S.truck,h:+$('m_h').value,w:+$('m_w').value,l:+$('m_l').value,wt:+$('m_wt').value,ax:+$('m_ax').value||2};store.set('truck',S.truck);renderChip();shSettings.close();notice('Medidas salvas',2500);};
$('swToll').onclick=()=>{S.toll=!S.toll;store.set('toll',S.toll);renderSettings();};
$('swVoice').onclick=()=>{S.voice=!S.voice;store.set('voice',S.voice);renderSettings();};
$('segTheme').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.v;store.set('theme',S.theme);applyTheme();renderSettings();});
$('testVoice').onclick=()=>{pickVoice();speak('Em 800 metros, vire à direita na BR 381. Radar a 500 metros, limite 80.');};

function unscroll(){window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;}
document.addEventListener('focusin',()=>setTimeout(unscroll,0));document.addEventListener('focusout',()=>{unscroll();setTimeout(unscroll,60);});
window.addEventListener('scroll',unscroll);document.body.addEventListener('scroll',unscroll);
/* ===== início ===== */
drawReports();
window.addEventListener('resize',()=>{setTimeout(()=>map.invalidateSize(),100);Object.values(SHEETS).forEach(s=>{if(s.state)s.open(s.state);});});
if(S.truck){renderChip();showHome();}else{renderTruckGrid();$('ob').classList.add('on');S.screen='onboard';}
startGPS();
</script>
</body>

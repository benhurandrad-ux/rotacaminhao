<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rota Caminhão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0B1220;--panel:#131F33;--panel2:#1A2942;--line:#243650;--text:#F2F5FB;--muted:#A9B6CC;
  --accent:#2F7BFF;--go:#22C55E;--go-text:#052E16;--badge-bg:#0F3D26;--badge-text:#86EFAC;
  --warn:#F59E0B;--warn-text:#1F1300;--danger:#EF4444;--r:16px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
html[data-theme="day"]{
  --bg:#FFFFFF;--panel:#F2F4F8;--panel2:#E6EAF2;--line:#CBD3E1;--text:#0B1220;--muted:#4A5670;
  --accent:#1B5FD9;--badge-bg:#DCFCE7;--badge-text:#14532D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;margin:0;overflow:hidden}
body{font-family:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:18px;line-height:1.3;font-variant-numeric:tabular-nums;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;border-radius:var(--r)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{filter:brightness(.9)}
svg{display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
#s-home,#s-preview,#s-nav{pointer-events:none}
#s-home>*,#s-preview .card,#s-preview .back-fab,#s-nav .nav-top,#s-nav .nav-bot,#s-nav .fab,.toast{pointer-events:auto}
#map{position:absolute;inset:0;background:var(--bg);z-index:0}
.leaflet-container{font:inherit;background:var(--bg)}
html[data-theme="night"] .leaflet-tile-pane{filter:invert(1) hue-rotate(195deg) brightness(.82) contrast(.92) saturate(.6)}
.leaflet-control-attribution{font-size:11px;background:var(--panel)!important;color:var(--muted)!important;opacity:.8}
.leaflet-control-attribution a{color:var(--muted)!important}
.pos{width:26px;height:26px;border-radius:50%;background:var(--accent);border:4px solid #fff;box-shadow:0 0 0 6px rgba(47,123,255,.3)}
.pin{width:32px;height:32px;border-radius:50%;background:var(--warn);color:var(--warn-text);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.pin svg{width:18px;height:18px}
.ab{background:#fff;color:#0B1220;font-weight:700;font-size:16px;border-radius:12px;padding:4px 10px;border:3px solid var(--accent);white-space:nowrap}
/* onboarding */
.ob{padding:calc(var(--sat) + 32px) 16px calc(var(--sab) + 16px);overflow:auto}
.ob h1{font-size:32px;margin:0 0 20px;line-height:1.15}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tcard{background:var(--panel);border:2px solid var(--line);min-height:112px;text-align:left;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between}
.tcard.sel{border-color:var(--accent)}
.tcard b{font-size:24px}.tcard small{font-size:18px;color:var(--muted)}
.tcard svg{width:36px;height:27px;flex:none;color:var(--muted)}
.link{color:var(--muted);font-size:18px;text-decoration:underline;padding:16px 0;min-height:56px;display:block;width:100%;text-align:center}
/* home */
.top-left{position:absolute;left:16px;top:calc(var(--sat) + 16px);z-index:20}
.chip{height:56px;padding:0 18px 0 14px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.chip svg{width:32px;height:24px;color:var(--muted)}
.fab{position:absolute;right:16px;z-index:20;width:56px;height:56px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
#centerBtn{bottom:calc(var(--sab) + 104px);display:none}
.where{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 16px);z-index:20;height:72px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 20px;font-size:24px;color:var(--muted);text-align:left;width:auto}
.where svg{width:28px;height:28px;color:var(--text)}
.toast{position:absolute;left:16px;right:16px;top:calc(var(--sat) + 84px);z-index:30;min-height:56px;background:var(--warn);color:var(--warn-text);display:none;align-items:center;padding:0 18px;font-size:20px;font-weight:700;border-radius:var(--r)}
.toast.on{display:flex}
/* search */
.sbar{display:flex;gap:12px;padding:calc(var(--sat) + 12px) 16px 12px;border-bottom:2px solid var(--line)}
.sq{width:56px;height:64px;flex:none;background:var(--panel);display:grid;place-items:center}
.sq svg{width:28px;height:28px}
.sbar input{flex:1;height:64px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);color:var(--text);font:inherit;font-size:24px;padding:0 16px;min-width:0}
.sbar input:focus{border-color:var(--accent);outline:none}
.list{flex:1;overflow:auto;padding-bottom:calc(var(--sab) + 16px)}
.row{width:100%;min-height:72px;display:flex;align-items:center;gap:14px;padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);border-radius:0}
.row svg{width:24px;height:24px;color:var(--muted);flex:none}
.row b{font-size:22px;display:block}.row span{font-size:18px;color:var(--muted);display:block}
.empty{padding:24px 16px;color:var(--muted);font-size:20px}
/* preview */
.pv-map{height:45%;position:relative}
.card{flex:1;background:var(--panel);border-top:2px solid var(--line);padding:20px 16px calc(var(--sab) + 16px);display:flex;flex-direction:column;gap:14px;overflow:auto}
.tl{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.tl b{font-size:48px;line-height:1}.tl span{font-size:28px;color:var(--muted)}
.badge{min-height:56px;background:var(--badge-bg);color:var(--badge-text);display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:var(--r);font-size:20px;font-weight:700}
.badge.neutral{background:var(--panel2);color:var(--text)}
.badge svg{width:24px;height:24px;flex:none}
.go{height:80px;width:100%;background:var(--go);color:var(--go-text);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px}
.go svg{width:32px;height:32px}
.go[disabled]{opacity:.5}
.links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.links button{height:56px;background:var(--panel2);border:2px solid var(--line);font-size:18px;font-weight:700;color:var(--text);white-space:nowrap}
.links button[disabled]{opacity:.4}
.calc{font-size:22px;color:var(--text)}
.bar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:40%;background:var(--accent);animation:slide 1.2s infinite ease-in-out}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%}}
.back-fab{position:absolute;left:16px;top:calc(var(--sat) + 16px);z-index:20;width:56px;height:56px;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center}
.back-fab svg{width:28px;height:28px}
/* nav */
.nav-top{background:var(--panel);border-bottom:2px solid var(--line);padding:calc(var(--sat) + 12px) 16px 12px;min-height:176px;display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;z-index:20}
.nav-top.state{background:var(--accent);color:#fff}
.nav-top.warn{background:var(--warn);color:var(--warn-text)}
.nav-top.ok{background:var(--go);color:var(--go-text)}
.man{display:flex;align-items:center;gap:16px}
.man .ic{width:72px;height:72px;flex:none}
.man .ic svg{width:72px;height:72px}
.man .dist{font-size:64px;font-weight:700;line-height:1}
.ins{font-size:40px;font-weight:700;line-height:1.1;max-height:2.2em;overflow:hidden}
.road{font-size:24px;color:var(--muted)}
.nav-top.state .road,.nav-top.warn .road{color:inherit;opacity:.85}
.next{font-size:20px;color:var(--muted);min-height:40px;display:flex;align-items:center}
.st{font-size:40px;font-weight:700;line-height:1.1}
.st-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.st-row button{height:56px;padding:0 18px;background:rgba(0,0,0,.2);font-size:20px;font-weight:700;color:inherit}
.nav-map{flex:1;position:relative}
.nav-bot{background:var(--panel);border-top:2px solid var(--line);height:calc(96px + var(--sab));padding:0 16px var(--sab);display:flex;align-items:center;justify-content:space-between;position:relative;z-index:20}
.eta{text-align:left;flex:1;height:96px;display:flex;flex-direction:column;justify-content:center;border-radius:0}
.eta b{font-size:32px;line-height:1}.eta span{font-size:20px;color:var(--muted)}
.lim{width:64px;height:64px;border-radius:50%;background:#fff;border:6px solid #E11D48;color:#0B1220;display:none;place-items:center;font-size:26px;font-weight:700;line-height:1;flex:none;margin-right:12px}
.lim.on{display:grid}
.radar{width:30px;height:30px;border-radius:50%;background:#E11D48;color:#fff;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.radar svg{width:16px;height:16px}
.rep{width:64px;height:64px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700}
.rep svg{width:30px;height:30px;color:var(--warn)}
#svNavBtn svg{color:var(--accent)}
.eta{min-width:0}
/* sheets */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:var(--panel);border-top:2px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:16px 16px calc(var(--sab) + 16px);transform:translateY(105%);visibility:hidden;transition:transform .15s ease-out,visibility 0s .15s;max-height:75%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet.on{transform:none;visibility:visible;transition:transform .15s ease-out,visibility 0s}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{font-size:24px;margin:0 0 4px}
.tile{height:96px;background:var(--panel2);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:22px;font-weight:700}
.tile svg{width:32px;height:32px}
.tile.cancel{background:transparent}
.big{height:64px;width:100%;background:var(--panel2);border:2px solid var(--line);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.big.danger{color:var(--danger);border-color:var(--danger)}
.big.go{background:var(--go);color:var(--go-text);border:0}
.big svg{width:24px;height:24px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
.scrim.on{display:block}
.cmp{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0 8px;font-size:20px}
.cmp>div{min-height:56px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.cmp .h{font-weight:700;color:var(--muted);font-size:18px}
.cmp .car{color:var(--muted)}.cmp .tr{color:var(--accent);font-weight:700}
.cmp .bad{color:var(--danger);font-weight:700}.cmp .wr{color:var(--warn);font-weight:700}
.steps{display:flex;flex-direction:column}
.steps div{display:flex;gap:12px;align-items:center;min-height:64px;border-bottom:1px solid var(--line);font-size:20px}
.steps div span:first-child{width:72px;flex:none;color:var(--muted);font-weight:700}
.steps svg{width:28px;height:28px;flex:none}
/* arrived */
.arr{background:var(--go);color:var(--go-text);align-items:center;justify-content:center;text-align:center;padding:24px}
.arr h1{font-size:40px;margin:0 0 12px}.arr p{font-size:22px;margin:0 0 32px;max-width:32ch}
.arr button{height:72px;padding:0 32px;background:var(--go-text);color:#fff;font-size:24px;font-weight:700;width:100%;max-width:360px}
/* settings */
.set{flex:1;overflow:auto;padding-bottom:calc(var(--sab) + 16px)}
.srow{width:100%;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;font-size:22px;border-bottom:1px solid var(--line);border-radius:0;text-align:left;gap:12px}
.srow small{color:var(--muted);font-size:18px}
.sw{width:64px;height:36px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:32px}
.seg{display:flex;gap:6px}
.seg button{height:44px;padding:0 14px;background:var(--panel2);border:2px solid var(--line);font-size:18px;font-weight:700}
.seg button.on{border-color:var(--accent);color:var(--accent)}
.meas{padding:0 16px}
.meas label{display:block;font-size:18px;color:var(--muted);margin:12px 0 6px}
.meas .f{position:relative}
.meas input{width:100%;height:64px;background:var(--panel);border:2px solid var(--line);border-radius:var(--r);color:var(--text);font:inherit;font-size:24px;padding:0 64px 0 16px}
.meas .f span{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}
.hdr{display:flex;align-items:center;gap:12px;padding:calc(var(--sat) + 12px) 16px 12px;border-bottom:2px solid var(--line)}
.hdr h1{font-size:24px;margin:0}
</style>
</head>
<body>

<div id="map" aria-hidden="true"></div>

<!-- Primeiro uso -->
<section class="screen ob" id="s-onboard" aria-label="Escolher caminhão">
  <h1>Qual é o seu caminhão?</h1>
  <div class="grid2" id="truckGrid"></div>
  <button class="link" id="obAdjust">Ajustar altura, peso e comprimento</button>
</section>

<!-- Home -->
<section class="screen" id="s-home" style="background:transparent">
  <div class="top-left"><button class="chip" id="chip" aria-label="Meu caminhão e configurações"></button></div>
  <button class="fab" id="centerBtn" aria-label="Centralizar"></button>
  <div class="toast" id="toast" role="status"></div>
  <button class="where" id="whereBtn"><span id="icSearch"></span><span>Pra onde?</span></button>
</section>

<!-- Busca -->
<section class="screen" id="s-search" aria-label="Buscar destino">
  <div class="sbar">
    <button class="sq" id="searchBack" aria-label="Voltar"></button>
    <input id="q" type="search" placeholder="Cidade, endereço ou rodovia" autocomplete="off" enterkeyhint="search" aria-label="Destino">
  </div>
  <div class="list" id="results"></div>
</section>

<!-- Prévia -->
<section class="screen" id="s-preview" style="background:transparent">
  <div class="pv-map"><button class="back-fab" id="pvBack" aria-label="Voltar"></button></div>
  <div class="card" id="pvCard"></div>
</section>

<!-- Navegação -->
<section class="screen" id="s-nav" style="background:transparent">
  <div class="nav-top" id="navTop"></div>
  <div class="nav-map"><button class="fab" id="navCenter" style="bottom:16px;display:none" aria-label="Centralizar"></button></div>
  <div class="nav-bot">
    <button class="eta" id="etaBtn" aria-label="Opções da viagem"><b id="etaTime">--:--</b><span id="etaSub"></span></button>
    <div class="lim" id="limSign" aria-label="Limite de velocidade"></div>
    <button class="rep" id="svNavBtn" aria-label="Ver a rua da próxima manobra" style="margin-right:12px"><span id="icEye"></span>Ver rua</button>
    <button class="rep" id="repBtn" aria-label="Reportar problema"><span id="icWarn"></span>Reportar</button>
  </div>
</section>

<!-- Chegou -->
<section class="screen arr" id="s-arrived">
  <h1>Você chegou</h1>
  <p id="arrSum"></p>
  <button id="arrBack">Voltar ao mapa</button>
</section>

<!-- Configurações -->
<section class="screen" id="s-settings">
  <div class="hdr"><button class="sq" id="setBack" aria-label="Voltar"></button><h1>Configurações</h1></div>
  <div class="set">
    <button class="srow" id="setTruck"><span>Meu caminhão</span><small id="setTruckName"></small></button>
    <div class="meas" id="meas">
      <label for="m_h">Altura</label><div class="f"><input id="m_h" type="number" inputmode="decimal" step="0.1"><span>m</span></div>
      <label for="m_w">Largura</label><div class="f"><input id="m_w" type="number" inputmode="decimal" step="0.1"><span>m</span></div>
      <label for="m_l">Comprimento</label><div class="f"><input id="m_l" type="number" inputmode="decimal" step="0.1"><span>m</span></div>
      <label for="m_wt">Peso total</label><div class="f"><input id="m_wt" type="number" inputmode="decimal" step="0.5"><span>t</span></div>
      <label for="m_ax">Eixos</label><div class="f"><input id="m_ax" type="number" inputmode="numeric" step="1"><span>eixos</span></div>
      <button class="big go" id="saveMeas" style="margin:16px 0 8px">Salvar</button>
    </div>
    <div class="srow"><span>Aceitar pedágio</span><button class="sw" id="swToll" role="switch" aria-label="Aceitar pedágio"></button></div>
    <div class="srow"><span>Tela</span><div class="seg" id="segTheme"><button data-v="auto">Automático</button><button data-v="day">Dia</button><button data-v="night">Noite</button></div></div>
    <div class="srow"><span>Som das instruções</span><button class="sw" id="swVoice" role="switch" aria-label="Som das instruções"></button></div>
    <div class="srow"><span>Voz</span><small id="voiceName"></small></div>
    <div class="meas"><button class="big" id="testVoice" style="margin:8px 0 16px">Testar voz</button></div>
    <div class="srow"><small>Rota Caminhão · protótipo · R$ 60 por mês</small></div>
  </div>
</section>

<!-- Folhas -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sh-report" role="dialog" aria-label="Reportar problema">
  <h2>O que tem aqui?</h2>
  <div class="grid2" id="repGrid"></div>
</div>
<div class="sheet" id="sh-trip" role="dialog" aria-label="Opções da viagem">
  <button class="big danger" id="leaveBtn">Sair da rota</button>
  <button class="big" id="stepsBtn2">Passo a passo</button>
  <button class="big" id="voiceBtn">Som ligado</button>
  <button class="big" id="simBtn">Simular viagem (teste)</button>
</div>
<div class="sheet" id="sh-diff" role="dialog" aria-label="Ver diferenças">
  <h2>Carro x seu caminhão</h2>
  <div class="cmp" id="cmp"></div>
  <div class="links" style="grid-template-columns:1fr 1fr"><button id="openWaze">Ver no Waze</button><button id="openGmaps">Ver no Google Maps</button></div>
  <button class="big" id="diffClose">Voltar</button>
</div>
<div class="sheet" id="sh-steps" role="dialog" aria-label="Passo a passo">
  <h2>Passo a passo</h2>
  <div class="steps" id="stepsList"></div>
  <button class="big" id="stepsClose">Voltar</button>
</div>
<div class="sheet" id="sh-street" role="dialog" aria-label="Ver a rua" style="max-height:85%;padding:12px 12px calc(var(--sab) + 12px)">
  <div style="position:relative;width:100%;aspect-ratio:4/5;max-height:60vh;background:var(--panel2);border-radius:var(--r);overflow:hidden"><iframe id="svFrame" title="Street View" style="width:100%;height:100%;border:0" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
  <div class="links" style="grid-template-columns:1fr 1fr"><button id="svOpenApp">Abrir no Google Maps</button><button id="svClose">Voltar</button></div>
</div>
<div class="sheet" id="sh-leave" role="dialog" aria-label="Sair da rota">
  <h2>Sair da rota?</h2>
  <button class="big danger" id="leaveYes">Sair</button>
  <button class="big" id="leaveNo">Continuar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ ícones (traço 2.5, estilo Phosphor bold) ============ */
const I={
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

async function post(ep,body){const r=await fetch(`${VALHALLA}/${ep}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error(ep+' '+r.status);return r.json();}
function decode(str,prec=6){let i=0,lat=0,lng=0,out=[],f=Math.pow(10,prec);while(i<str.length){let b,s=0,r=0;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lat+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=str.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);lng+=(r&1)?~(r>>1):(r>>1);out.push([lat/f,lng/f]);}return out;}
function truckOpts(){const t=S.truck;return {truck:{height:t.h,width:t.w,length:t.l,weight:t.wt,axle_load:Math.min(10,t.wt/t.ax),axle_count:t.ax,use_highways:1,use_tolls:S.toll?1:0,use_tracks:0,exclude_unpaved:true,use_living_streets:0,service_penalty:600}}}

  const body={locations:[{lat:a.lat,lon:a.lon},{lat:b.lat,lon:b.lon}],costing,units:'kilometers',language:'pt-BR'};
  if(costing==='truck'){body.costing_options=truckOpts();
    const ex=S.reports.filter(r=>['dirt','bridge','notruck','narrow'].includes(r.type)).map(r=>({lat:r.lat,lon:r.lng}));
    if(ex.length)body.exclude_locations=ex.slice(-50);}
  const j=await post('route',body);const leg=j.trip.legs[0];
  const pts=decode(leg.shape);
  return {km:j.trip.summary.length,min:j.trip.summary.time/60,shape:leg.shape,pts,maneuvers:leg.maneuvers,cum:cumDist(pts)};
}

  const j=await post('trace_attributes',{encoded_polyline:shape,costing,shape_match:'edge_walk',units:'kilometers',filters:{attributes:['edge.surface','edge.road_class','edge.length','edge.begin_shape_index','edge.end_shape_index','edge.speed_limit'],action:'include'}});
  const pts=decode(j.shape||shape),UNP=new Set(['compacted','dirt','gravel','path','impassable','paved_rough']),URB=new Set(['residential','unclassified','service_other','living_street']);
  let dirt=0,urban=0,hwy=0,total=0,dirtSegs=[],urbSegs=[],limits=[],along=0;
  const routeKm=(j.edges||[]).reduce((a,e)=>a+(e.length||0),0);
  for(const e of (j.edges||[])){const L=e.length||0;total+=L;if(e.speed_limit&&e.speed_limit<200)limits.push({b:e.begin_shape_index,e:e.end_shape_index,v:e.speed_limit});
    const access=along<0.5||routeKm-along<0.5;along+=L; // saída e chegada (500 m) não contam como "dentro de cidade"
    if(access&&!UNP.has(e.surface)){if(['motorway','trunk','primary'].includes(e.road_class))hwy+=L;continue;}const seg=pts.slice(e.begin_shape_index,e.end_shape_index+1);
    if(UNP.has(e.surface)){dirt+=L;dirtSegs.push(seg);}else if(URB.has(e.road_class)){urban+=L;urbSegs.push(seg);}

}
async function fetchRadars(rt){
  const local=radarsFromDB(rt);
  const pts=rt.pts;const step=Math.max(1,Math.floor(pts.length/160));
  const line=pts.filter((_,i)=>i%step===0||i===pts.length-1).map(p=>`${p[0].toFixed(5)},${p[1].toFixed(5)}`).join(',');
  const q=`[out:json][timeout:12];node["highway"="speed_camera"](around:60,${line});out;`;
  const servers=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  let live=null;
  for(const srv of servers){
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
    try{const r=await fetch(srv,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
      clearTimeout(to);if(!r.ok)throw 0;const j=await r.json();
      live=(j.elements||[]).map(e=>{const n=nearest(pts,[e.lat,e.lon]);return {lat:e.lat,lon:e.lon,max:parseInt((e.tags||{}).maxspeed)||null,along:rt.cum[n.i]+(rt.cum[n.i+1]-rt.cum[n.i])*n.t,id:e.lat.toFixed(5)+','+e.lon.toFixed(5)};});
      break;
    }catch(e){clearTimeout(to);}
  }
  const all=[...local];
  (live||[]).forEach(x=>{if(!all.some(y=>Math.abs(y.lat-x.lat)<0.0003&&Math.abs(y.lon-x.lon)<0.0003))all.push(x);});
  return all.sort((a,b)=>a.along-b.along);
}
const unknownLayer=L.layerGroup().addTo(map);
async function fetchUnknownSurface(rt){
  const pts=rt.pts;const step=Math.max(1,Math.floor(pts.length/160));
  const line=pts.filter((_,i)=>i%step===0||i===pts.length-1).map(p=>`${p[0].toFixed(5)},${p[1].toFixed(5)}`).join(',');
  const q=`[out:json][timeout:12];way[highway~"^(unclassified|tertiary|tertiary_link|track|road|secondary)$"][!surface](around:25,${line});out geom;`;
  for(const srv of ['https://overpass-api.de/api/interpreter','https://lz4.overpass-api.de/api/interpreter']){
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),12000);
    try{const r=await fetch(srv,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
      clearTimeout(to);if(!r.ok)throw 0;const j=await r.json();
      let km=0,segs=[];
      for(const w of (j.elements||[])){const g=(w.geometry||[]).map(n=>[n.lat,n.lon]);

/* geometria */
const R=6371000,rad=x=>x*Math.PI/180;
function hav(a,b){const dLat=rad(b[0]-a[0]),dLon=rad(b[1]-a[1]);const s=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function cumDist(pts){const c=[0];for(let i=1;i<pts.length;i++)c.push(c[i-1]+hav(pts[i-1],pts[i]));return c;}
function nearest(pts,p){ // retorna {i, t, d, pt} do ponto mais próximo no segmento i
  let best={i:0,t:0,d:1e12,pt:pts[0]};
  const kx=Math.cos(rad(p[0]));
  for(let i=0;i<pts.length-1;i++){
    const ax=(pts[i][1]-p[1])*kx,ay=pts[i][0]-p[0],bx=(pts[i+1][1]-p[1])*kx,by=pts[i+1][0]-p[0];
    const dx=bx-ax,dy=by-ay;const L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));
    const qx=ax+t*dx,qy=ay+t*dy;const d=Math.sqrt(qx*qx+qy*qy)*111320;
    if(d<best.d)best={i,t,d,pt:[pts[i][0]+t*(pts[i+1][0]-pts[i][0]),pts[i][1]+t*(pts[i+1][1]-pts[i][1])]};
  }
  return best;
}

function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/pt[-_]BR/i.test(v.lang));
  const pref=['Luciana','Google português do Brasil','Francisca','Camila','Thalita','Antônio'];
  ptVoice=vs.find(v=>pref.some(n=>v.name.includes(n))&&!v.name.includes('Eloquence'))||vs.find(v=>v.localService===false)||vs[0]||null;}catch(e){}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';if(ptVoice)u.voice=ptVoice;u.rate=1.02;u.pitch=1;speechSynthesis.speak(u);}catch(e){}}
async function recalc(){
  S.navi.recalc=true;setState('Recalculando...','state');if(S.voice)speak('Recalculando a rota.');
  try{const tr=await route(S.pos,S.dest,'truck');S.route=tr;S.origin={...S.pos};drawRoute(tr,null,false);spoken=new Set();offCount=0;fetchRadars(tr).then(rs=>{S.radars=rs;drawRadars();});xray(tr.shape,'truck').then(x=>{S.xray=S.xray||{};S.xray.truck=x;}).catch(()=>{});}
  catch(e){setState('Sem sinal. Seguindo pela rota salva.','state',5000);}
  S.navi.recalc=false;clearState();
}
function arrive(){
  const n=S.navi;stopNav();
  const parts=[];if(n.evDirt>0.5)parts.push(`${fmtKm(n.evDirt)} de estrada de chão`);if(n.evUrban>1)parts.push(`${fmtKm(n.evUrban)} dentro de cidade`);
  $('arrSum').textContent=parts.length?`Hoje você evitou ${parts.join(' e ')}.`:`Boa viagem. Até a próxima.`;
  show('arrived');if(S.voice)speak('Você chegou');
}
$('arrBack').onclick=()=>{show('home');recenter();};
/* opções da viagem */
$('etaBtn').onclick=()=>{$('voiceBtn').textContent=S.voice?'Som ligado':'Som desligado';$('simBtn').textContent=S.navi&&S.navi.sim?'Parar simulação':'Simular viagem (teste)';openSheet('sh-trip');};
$('leaveBtn').onclick=()=>{closeSheets();openSheet('sh-leave');};
$('leaveNo').onclick=closeSheets;
$('leaveYes').onclick=()=>{closeSheets();stopNav();show('home');recenter();};
$('voiceBtn').onclick=()=>{S.voice=!S.voice;store.set('voice',S.voice);$('voiceBtn').textContent=S.voice?'Som ligado':'Som desligado';renderSettings();};
$('simBtn').onclick=()=>{closeSheets();if(simTimer){clearInterval(simTimer);simTimer=null;S.navi.sim=false;return;}startSim();};
function startSim(){
  S.navi.sim=true;S.navi.speed=80;let along=0;const r=()=>S.route;
  const n0=nearest(r().pts,[S.pos.lat,S.pos.lon]);along=r().cum[n0.i]+(r().cum[n0.i+1]-r().cum[n0.i])*n0.t;
  simTimer=setInterval(()=>{
    if(!S.navi)return;const rt=r();along+=(S.navi.speed/3.6)*1*6; // 6x mais rápido que o real
    let i=rt.cum.findIndex(c=>c>along);if(i<0){S.pos={lat:rt.pts.at(-1)[0],lon:rt.pts.at(-1)[1],speed:0};}
    else{const t=(along-rt.cum[i-1])/(rt.cum[i]-rt.cum[i-1]);S.pos={lat:rt.pts[i-1][0]+t*(rt.pts[i][0]-rt.pts[i-1][0]),lon:rt.pts[i-1][1]+t*(rt.pts[i][1]-rt.pts[i-1][1]),speed:80};}
    posMarker.setLatLng([S.pos.lat,S.pos.lon]);navTick();
  },1000);
}
/* relato */
let repAutoClose=null;
$('repGrid').innerHTML=REPORT_TYPES.map(t=>`<button class="tile" data-id="${t.id}">${I[t.ic]}<span>${t.label}</span></button>`).join('')+`<button class="tile cancel" id="repCancel">${I.x}<span>Cancelar</span></button>`;
$('repBtn').onclick=()=>{openSheet('sh-report');repAutoClose=setTimeout(closeSheets,10000);};
$('repCancel').onclick=closeSheets;
$('repGrid').querySelectorAll('.tile[data-id]').forEach(b=>b.onclick=()=>{
  const rep={type:b.dataset.id,lat:S.pos.lat,lng:S.pos.lon,date:new Date().toISOString(),sent:navigator.onLine};
  S.reports.push(rep);store.set('reports',S.reports);drawReports();closeSheets();
  setState(navigator.onLine?'Relato enviado. Obrigado.':'Relato guardado. Envio quando tiver sinal.','ok',4000,'<button id="undoRep">Desfazer</button>');
  $('undoRep').onclick=()=>{S.reports=S.reports.filter(x=>x!==rep);store.set('reports',S.reports);drawReports();clearState();};
});

/* ============ configurações ============ */
function openSettings(){renderSettings();show('settings');}
function renderSettings(){
  renderChip();const t=S.truck;$('m_h').value=t.h;$('m_w').value=t.w;$('m_l').value=t.l;$('m_wt').value=t.wt;$('m_ax').value=t.ax;
  $('swToll').classList.toggle('on',S.toll);$('swVoice').classList.toggle('on',S.voice);pickVoice();$('voiceName').textContent=ptVoice?ptVoice.name:(window.speechSynthesis?'Voz padrão do celular':'Sem voz neste aparelho');
  $('segTheme').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.theme));
}
$('setBack').onclick=()=>{show('home');recenter();};
$('setTruck').onclick=()=>{renderTruckGrid();show('onboard');};
$('saveMeas').onclick=()=>{S.truck={...S.truck,h:+$('m_h').value,w:+$('m_w').value,l:+$('m_l').value,wt:+$('m_wt').value,ax:+$('m_ax').value||2};store.set('truck',S.truck);renderChip();toast('Medidas salvas');show('home');recenter();};
$('swToll').onclick=()=>{S.toll=!S.toll;store.set('toll',S.toll);renderSettings();};
$('swVoice').onclick=()=>{S.voice=!S.voice;store.set('voice',S.voice);renderSettings();};
$('testVoice').onclick=()=>{pickVoice();speak('Em 800 metros, vire à direita na BR 381. Estrada de chão relatada a 1 quilômetro à frente.');};
$('segTheme').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.theme=b.dataset.v;store.set('theme',S.theme);applyTheme();renderSettings();});

/* ============ início ============ */
drawReports();
window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(),100));
if(S.truck){renderChip();show('home');}else{renderTruckGrid();show('onboard');}
startGPS();
</script>
</body>
